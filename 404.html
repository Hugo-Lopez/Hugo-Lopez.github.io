<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Hugo Lopez</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#151412">

  <!-- GitHub shows this file for any address that does not exist on the site.
       It sends the visitor straight to the home page. "replace" keeps the dead
       address out of the browser history, so the Back button still works. -->
  <script>window.location.replace('/');</script>
  <meta http-equiv="refresh" content="0; url=/">

  <!-- Addresses start with "/" here because this page can be shown at any address. -->
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .not-found {
      max-width: 36rem;
      margin: 0 auto;
      padding: 6rem 1.5rem;
    }

    .not-found .lead {
      margin: 0 0 2rem;
      color: var(--text-2);
    }

    .not-found .button {
      font-size: 0.875rem;
    }
  </style>
</head>

<body>
  <!-- Only seen if the browser blocks the automatic move above. -->
  <main class="not-found">
    <p class="lead">Taking you to Hugo Lopez's home page.</p>
    <a class="button" href="/">Go to the home page</a>
  </main>
</body>
</html>
